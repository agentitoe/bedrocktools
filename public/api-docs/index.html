<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BedrockTools API Docs</title>
  <meta name="description" content="Documentación oficial de la API de BedrockTools (OpenAPI). Prueba los endpoints desde el navegador." />
  <link rel="canonical" href="https://bedrocktools.pages.dev/api-docs/" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="./swagger/swagger-ui.css" />
  <style>
    body { margin: 0; background: #fafafa; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bt-header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #101418; color: #fff; }
    .bt-header a { color: #fff; text-decoration: none; }
    .bt-header a:hover { text-decoration: underline; }
    .bt-brand { font-weight: 700; }
    .bt-docs { opacity: .7; }
    .bt-spacer { flex: 1; }
    .bt-speclinks { display: flex; gap: 12px; font-size: 14px; opacity: .9; }
    #swagger-ui { max-width: 1460px; margin: 0 auto; padding: 8px 16px 48px; }
  </style>
</head>
<body>
  <header class="bt-header">
    <a class="bt-brand" href="/">⛏ BedrockTools</a>
    <span class="bt-docs">API Docs</span>
    <span class="bt-spacer"></span>
    <nav class="bt-speclinks" aria-label="Spec">
      <a href="/openapi.json" target="_blank" rel="noopener">openapi.json</a>
      <a href="/openapi.yaml" target="_blank" rel="noopener">openapi.yaml</a>
    </nav>
  </header>

  <div id="swagger-ui"></div>

  <noscript>
    <div style="max-width:720px;margin:40px auto;padding:24px;font-family:sans-serif;">
      <h1>BedrockTools API Docs</h1>
      <p>Esta documentación necesita JavaScript. Spec: <a href="/openapi.json">openapi.json</a> · <a href="/openapi.yaml">openapi.yaml</a></p>
      <pre>curl -F "file=@addon.mcaddon" https://bedrocktools.pages.dev/api/addon-converter --output addon_MODIFIED.mcaddon</pre>
    </div>
  </noscript>

  <script src="./swagger/swagger-ui-bundle.js"></script>
  <script src="./swagger/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function () {
      SwaggerUIBundle({
        url: "/openapi.json",
        dom_id: "#swagger-ui",
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "StandaloneLayout",
        tryItOutEnabled: true,
        persistAuthorization: true,
        displayRequestDuration: true,
        docExpansion: "list",
        defaultModelsExpandDepth: 1,
        oauth2RedirectUrl: "./swagger/oauth2-redirect.html"
      });
    };
  </script>
</body>
</html>
