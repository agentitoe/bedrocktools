<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
	<!--
		Shared icon sprite. Every page and the JS bundles reference these with
		<svg class="icon"><use href="/assets/icons.svg#i-name"/></svg>.

		Conventions: 24x24 grid, 1.6px stroke, round caps and joins, currentColor.
		Filled shapes (flags, the half-disc in the theme toggle) carry their own
		fill so they ignore the inherited stroke-only rules.
	-->

	<!-- Brand / tool identity -->
	<symbol id="i-blocks" viewBox="0 0 24 24">
		<rect x="3" y="3" width="8" height="8" rx="1.5" />
		<rect x="13" y="3" width="8" height="8" rx="1.5" />
		<rect x="3" y="13" width="8" height="8" rx="1.5" />
		<path d="M13 13h8v8h-8z" />
	</symbol>

	<symbol id="i-cube" viewBox="0 0 24 24">
		<path d="M12 2.8 21 7.4 12 12 3 7.4z" />
		<path d="M3 7.4 12 12v9.8L3 17.2z" />
		<path d="M21 7.4 12 12v9.8l9-4.6z" />
	</symbol>

	<symbol id="i-grid3" viewBox="0 0 24 24">
		<rect x="2.5" y="3.5" width="14" height="14" rx="2" />
		<path d="M7 3.5v14M11.5 3.5v14M2.5 8h14M2.5 12.5h14" />
		<path d="M19 12h3.5m-2-2 2 2-2 2" />
	</symbol>

	<symbol id="i-axes" viewBox="0 0 24 24">
		<path d="M12 2.5V21M2.5 12H21" />
		<path d="M9.2 5.3 12 2.5l2.8 2.8M14.8 18.7 12 21.5l-2.8-2.8M5.3 9.2 2.5 12l2.8 2.8M18.7 14.8 21.5 12l-2.8-2.8" />
		<circle cx="12" cy="12" r="2.2" />
	</symbol>

	<symbol id="i-circle" viewBox="0 0 24 24">
		<circle cx="12" cy="12" r="8.4" />
		<circle cx="12" cy="12" r="3.2" />
	</symbol>

	<symbol id="i-convert" viewBox="0 0 24 24">
		<path d="M4 8.5h13m-3-3 3 3-3 3" />
		<path d="M20 15.5H7m3-3-3 3 3 3" />
	</symbol>

	<symbol id="i-stack" viewBox="0 0 24 24">
		<path d="M12 3 21 7.4 12 11.8 3 7.4z" />
		<path d="m3 12 9 4.4L21 12" />
		<path d="m3 16.6 9 4.4 9-4.4" />
	</symbol>

	<symbol id="i-file-code" viewBox="0 0 24 24">
		<path d="M6 3h8l4 4v14H6z" />
		<path d="M14 3v4h4" />
		<path d="m10.2 12-2 2.4 2 2.4M13.8 12l2 2.4-2 2.4" />
	</symbol>

	<symbol id="i-pencil" viewBox="0 0 24 24">
		<path d="M4 20h4l11-11-4-4L4 16z" />
		<path d="m14.5 5.5 4 4" />
	</symbol>

	<symbol id="i-image" viewBox="0 0 24 24">
		<rect x="3" y="4.5" width="18" height="15" rx="2.5" />
		<circle cx="8.5" cy="9.5" r="1.6" />
		<path d="m4 17 4.5-4.5 3.5 3.5 3-3L20 17" />
	</symbol>

	<symbol id="i-home" viewBox="0 0 24 24">
		<path d="M4 10.5 12 4l8 6.5V20H4z" />
		<path d="M9.5 20v-6h5v6" />
	</symbol>

	<!-- Chrome -->
	<symbol id="i-globe" viewBox="0 0 24 24">
		<circle cx="12" cy="12" r="9" />
		<path d="M3 12h18" />
		<path d="M12 3c2.8 3.6 2.8 14.4 0 18-2.8-3.6-2.8-14.4 0-18z" />
	</symbol>

	<symbol id="i-contrast" viewBox="0 0 24 24">
		<circle cx="12" cy="12" r="9" />
		<path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none" />
	</symbol>

	<symbol id="i-arrow-left" viewBox="0 0 24 24">
		<path d="M20 12H4.5m6-6.5L4.5 12l6 6.5" />
	</symbol>

	<symbol id="i-arrow-right" viewBox="0 0 24 24">
		<path d="M4 12h15.5m-6-6.5L19.5 12l-6 6.5" />
	</symbol>

	<symbol id="i-download" viewBox="0 0 24 24">
		<path d="M12 3.5v11m-4-4 4 4 4-4" />
		<path d="M4.5 20h15" />
	</symbol>

	<symbol id="i-close" viewBox="0 0 24 24">
		<path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5" />
	</symbol>

	<symbol id="i-search" viewBox="0 0 24 24">
		<circle cx="11" cy="11" r="6.8" />
		<path d="M16.2 16.2 21 21" />
	</symbol>

	<symbol id="i-check" viewBox="0 0 24 24">
		<path d="m4.5 12.5 5 5L19.5 6.5" />
	</symbol>

	<symbol id="i-copy" viewBox="0 0 24 24">
		<rect x="9" y="9" width="11.5" height="11.5" rx="2.5" />
		<path d="M5.5 15H5a1.5 1.5 0 0 1-1.5-1.5V5A1.5 1.5 0 0 1 5 3.5h8.5A1.5 1.5 0 0 1 15 5v.5" />
	</symbol>

	<symbol id="i-folder" viewBox="0 0 24 24">
		<path d="M3 7a2 2 0 0 1 2-2h4.2l2 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
	</symbol>

	<symbol id="i-file" viewBox="0 0 24 24">
		<path d="M6 3h8l4 4v14H6z" />
		<path d="M14 3v4h4" />
	</symbol>

	<symbol id="i-plus" viewBox="0 0 24 24">
		<path d="M12 5.5v13M5.5 12h13" />
	</symbol>

	<symbol id="i-trash" viewBox="0 0 24 24">
		<path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l.8 13h9.4l.8-13" />
	</symbol>

	<symbol id="i-save" viewBox="0 0 24 24">
		<path d="M5 3h11l3 3v15H5z" />
		<path d="M8.5 3v5h7V3M8.5 14.5h7v6h-7z" />
	</symbol>

	<symbol id="i-external" viewBox="0 0 24 24">
		<path d="M14 4h6v6M20 4 11 13" />
		<path d="M18 14v5.5H5.5V7H11" />
	</symbol>

	<symbol id="i-chevron-down" viewBox="0 0 24 24">
		<path d="m6.5 9.5 5.5 5.5 5.5-5.5" />
	</symbol>

	<symbol id="i-lock" viewBox="0 0 24 24">
		<rect x="5" y="10.5" width="14" height="9.5" rx="2.5" />
		<path d="M8.2 10.5V8a3.8 3.8 0 0 1 7.6 0v2.5" />
	</symbol>

	<symbol id="i-zap" viewBox="0 0 24 24">
		<path d="M13.5 2.5 5.5 14h5l-1 7.5 8-11.5h-5z" />
	</symbol>

	<symbol id="i-gamepad" viewBox="0 0 24 24">
		<path d="M7.6 7.5h8.8a5.4 5.4 0 0 1 5.4 5.4v1.1a3.9 3.9 0 0 1-7 2.4l-1-1.4h-3.6l-1 1.4a3.9 3.9 0 0 1-7-2.4v-1.1a5.4 5.4 0 0 1 5.4-5.4z" />
		<path d="M7 11v3.4M5.3 12.7h3.4M15.6 12.1h.01M17.6 14h.01" />
	</symbol>

	<!-- Flags -->
	<symbol id="flag-es" viewBox="0 0 20 14">
		<rect width="20" height="14" rx="1.5" fill="#c60b1e" />
		<rect y="3.5" width="20" height="7" fill="#ffc400" />
	</symbol>

	<symbol id="flag-gb" viewBox="0 0 20 14">
		<rect width="20" height="14" rx="1.5" fill="#012169" />
		<path d="M0 0 20 14M20 0 0 14" stroke="#fff" stroke-width="2.8" />
		<path d="M0 0 20 14M20 0 0 14" stroke="#c8102e" stroke-width="1.4" />
		<path d="M10 0v14M0 7h20" stroke="#fff" stroke-width="4.6" />
		<path d="M10 0v14M0 7h20" stroke="#c8102e" stroke-width="2.6" />
	</symbol>
</svg>
