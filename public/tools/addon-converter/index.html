    <body>
		<a class="skip-link" href="#main" data-i18n="skipToContent">Saltar al contenido</a>

            ><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-arrow-left"/></svg> <span data-i18n="backHome">Back to home</span></a
        >
        <div class="top-bar">
            <button
                class="icon-btn lang-toggle"
                id="langToggle"

            ></button>
            <div class="lang-dropdown" id="langDropdown" role="menu"></div>
            <button
                class="icon-btn theme-toggle"
                id="themeToggle"
                title="Cambiar tema"
                aria-label="Toggle theme"
            ></button>
        </div>
        <main id="main">
            <div class="card">
                <h1 data-i18n="heading">Addon Converter</h1>
                <p class="subtitle" data-i18n="description">
                    Sube tu archivo <strong>.mcpack</strong> o
                    <strong>.mcaddon</strong> para activar los logros.
                </p>
                <form id="uploadForm">
                    <div
                        class="drop-zone"
                        id="dropZone"
                        role="button"
                        tabindex="0"
                        aria-label="Upload file"
                    >
                        <div class="drop-prompt" id="dropPrompt">
                            <svg class="icon drop-icon" aria-hidden="true"><use href="/assets/icons.svg#i-folder"/></svg>
                            <p class="drop-main" data-i18n="dropPrompt">
                                
                                Arrastra tu archivo aquí o <u>haz clic</u> para
                                seleccionar
                            </p>
                            <p class="drop-sub" data-i18n="dropSub">
                                Se admite .mcpack y .mcaddon
                            </p>
                        </div>
                        <div id="fileNameDisplay">
                            <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-file"/></svg>
                            <span id="fileNameText"></span>
                        </div>
                        <input
                            type="file"
                            id="fileInput"
                            accept=".mcpack,.mcaddon"
                            required
                        />
                    </div>
                    <div class="form-actions">
                        <button
                            type="submit"
                            id="submitBtn"
                            data-i18n="submitBtn"
                        >
                            Convertir pack
                        </button>
                    </div>
                </form>
            </div>
            <div id="status"></div>
        </main>
		<footer
			class="site-footer"
			data-chrome="footer"
			data-footer-variant="default"
			data-footer-tagline="Herramientas gratuitas para el ecosistema Minecraft Bedrock."
		></footer>
		<script src="../../assets/footer.js" defer></script>
        <script type="module">
            import { processPack } from "./bundle.js";
            import { initUi, getLang } from "../../assets/ui.js";

            const translations = {
                es: {
			skipToContent: "Saltar al contenido",
		footerColProject: "Proyecto",
		footerLicense: "Licencias",
		footerAllTools: "Todas las herramientas",
		footerMadeWith: "Hecho con ♥ para la comunidad de Minecraft",
                    title: "Addon Converter — Bedrock Tools",
                    heading: "Activador de logros para addons",
                    description:
                        "Sube tu archivo <strong>.mcpack</strong> o <strong>.mcaddon</strong> para activar los logros.",
                    dropPrompt:
                        'Arrastra tu archivo aquí o <u>haz clic</u> para seleccionar',
                    dropSub: "Se admite .mcpack y .mcaddon",
                    submitBtn: "Convertir pack",
                    processing: "Procesando",
                    successText:
                        '<svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-check"/></svg> Conversión completada. Descarga el archivo:',
                    downloadText:
                        '<svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-download"/></svg> Descargar',
                    linkNote:
                        "El enlace solo funciona en esta página. Si lo cierras o actualizas, generalo otra vez.",
                    selectFile: "Selecciona un archivo",
                    unknownError:
                        '<svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-close"/></svg> Error desconocido',
                    changeLanguageTitle: "Cambiar idioma",
                    switchToLightTitle: "Cambiar a tema claro",
                    switchToDarkTitle: "Cambiar a tema oscuro",
                    backHome: "Volver al inicio",
                    invalidFile: "Archivo inválido",
                    fileTooLarge:
                        "El archivo supera el tamaño máximo permitido (30 MB)",
                    processError: "Error al procesar el archivo",
                    maxSizeMB: 30,
                    footerTagline:
                        "Herramientas gratuitas para Minecraft, en Java y Bedrock.",
                    copyright: "Hecho con ♥️ por AgentitoE",
                },
                en: {
			skipToContent: "Skip to content",
                    title: "Addon Converter — Bedrock Tools",
                    heading: "Addon Achievement Unlocker",
                    description:
                        "Upload your <strong>.mcpack</strong> or <strong>.mcaddon</strong> file to activate achievements.",
                    dropPrompt:
                        'Drag your file here or <u>click</u> to select',
                    dropSub: ".mcpack and .mcaddon supported",
                    submitBtn: "Convert pack",
                    processing: "Processing",
                    successText:
                        '<svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-check"/></svg> Conversion completed. Download the file:',
                    downloadText:
                        '<svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-download"/></svg> Download',
                    linkNote:
                        "This link only works on this page. If you close or refresh it, generate it again.",
                    selectFile: "Select a file",
                    unknownError:
                        '<svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-close"/></svg> Unknown error',
                    changeLanguageTitle: "Change language",
                    switchToLightTitle: "Switch to light theme",
                    switchToDarkTitle: "Switch to dark theme",
                    backHome: "Back to home",
                    invalidFile: "Invalid file",
                    fileTooLarge: "File exceeds maximum allowed size (30 MB)",
                    processError: "Error processing file",
                    maxSizeMB: 30,
                    footerTagline:
                        "Free tools for Minecraft, on Java and Bedrock.",
                    copyright: "Made with ♥️ by AgentitoE",
                },
            };

            const dropZone = document.getElementById("dropZone");
            const fileInput = document.getElementById("fileInput");
            const form = document.getElementById("uploadForm");
            const status = document.getElementById("status");
            const submitBtn = document.getElementById("submitBtn");
            const dropPrompt = document.getElementById("dropPrompt");
            const fileNameDisplay = document.getElementById("fileNameDisplay");
            let currentFile = null;
            let lastDownload = null;

            function renderSuccessCard(lang, url, newName) {
                const escapeHtml = (value) =>
                    String(value)
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/"/g, "&quot;")
                        .replace(/'/g, "&#39;");
                const safeName = escapeHtml(newName);
                return (
                    '<div class="status-card"><p class="success status-lead">' +
                    translations[lang].successText +
                    '</p><a class="download" href="' +
                    url +
                    '" download="' +
                    safeName +
                    '">' +
                    translations[lang].downloadText +
                    " " +
                    safeName +
                    '</a><p class="link-note">' +
                    translations[lang].linkNote +
                    "</p></div>"
                );
            }

            function renderErrorCard(lang, message) {
                const safeMessage = String(message)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
                return (
                    '<div class="status-card"><p class="error status-line">' +
                    (translations[lang].unknownError ||
                        translations.en.unknownError) +
                    ": " +
                    safeMessage +
                    "</p></div>"
                );
            }

            function updateStatusForLang(lang) {
                if (!status.innerHTML) return;
                const successMatch = status.innerHTML.match(
                    /href="([^"]+)" download="([^"]+)"/,
                );
                if (successMatch) {
                    status.innerHTML = renderSuccessCard(
                        lang,
                        successMatch[1],
                        successMatch[2],
                    );
                }
            }

            function showSelectedName(file) {
                if (file) {
                    document.getElementById("fileNameText").textContent =
                        file.name;
                    document.getElementById("fileNameDisplay").style.display =
                        "flex";
                    dropPrompt.style.display = "none";
                } else {
                    document.getElementById("fileNameDisplay").style.display =
                        "none";
                    dropPrompt.style.display = "";
                }
            }

            dropZone.addEventListener("click", () => fileInput.click());
            dropZone.addEventListener("dragover", (e) => {
                e.preventDefault();
                dropZone.classList.add("dragover");
            });
            dropZone.addEventListener("dragleave", () =>
                dropZone.classList.remove("dragover"),
            );
            dropZone.addEventListener("drop", (e) => {
                e.preventDefault();
                dropZone.classList.remove("dragover");
                const files = Array.from(e.dataTransfer.files);
                if (files.length > 0) {
                    currentFile = files[0];
                    const dt = new DataTransfer();
                    dt.items.add(currentFile);
                    fileInput.files = dt.files;
                    showSelectedName(currentFile);
                }
            });

            fileInput.addEventListener("change", () => {
                if (fileInput.files.length) {
                    currentFile = fileInput.files[0];
                    showSelectedName(currentFile);
                }
            });

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                const file = currentFile || fileInput.files[0];
                if (!file) {
                    alert(translations[getLang()].selectFile);
                    return;
                }

                submitBtn.disabled = true;
                dropZone.style.opacity = "0.7";
                dropZone.style.pointerEvents = "none";
                const lang = getLang();
                const escapeHtml = (value) =>
                    String(value)
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/"/g, "&quot;")
                        .replace(/'/g, "&#39;");
                status.innerHTML =
                    '<div class="status-card"><div class="status-row"><span class="spinner"></span><span class="status-title">' +
                    translations[lang].processing +
                    " " +
                    escapeHtml(file.name) +
                    "…</span></div></div>";

                try {
                    const buffer = await file.arrayBuffer();
                    if (buffer.byteLength > 30 * 1024 * 1024) {
                        throw new Error(translations[lang].fileTooLarge);
                    }
                    const data = new Uint8Array(buffer);
                    const result = await processPack(data);
                    const ext = file.name.includes(".")
                        ? file.name.slice(file.name.lastIndexOf("."))
                        : "";
                    const base = file.name.slice(
                        0,
                        file.name.lastIndexOf(".") || file.name.length,
                    );
                    const newName = ext
                        ? base + "_MODIFIED" + ext
                        : file.name + "_MODIFIED";
                    const blob = new Blob([result], {
                        type: "application/zip",
                    });
                    const url = URL.createObjectURL(blob);
                    lastDownload = { url, newName };
                    status.innerHTML = renderSuccessCard(lang, url, newName);
                } catch (err) {
                    lastDownload = null;
                    status.innerHTML = renderErrorCard(lang, err.message);
                } finally {
                    submitBtn.disabled = false;
                    dropZone.style.opacity = "1";
                    dropZone.style.pointerEvents = "auto";
                }
            });
            initUi(translations, { onApplyLang: updateStatusForLang });
        </script>
    </body>
</html>
